services:
  - type: web
    name: myterrain-api
    env: docker
    region: frankfurt
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: myTerrain
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: myterrain-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: myterrain-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: myterrain-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: myterrain-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: myterrain-db
          property: password

databases:
  - name: myterrain-db
    databaseName: myterrain
    user: terrain_user
    region: frankfurt
    plan: free
