name: Déploiement Préproduction

on:
  push:
    branches:
      - preprod
  workflow_dispatch: # Permet de déclencher manuellement via le bouton "Run workflow" sur GitHub

jobs:
  deploy:
    name: Déploiement sur le serveur DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - name: Connexion SSH et mise à jour des conteneurs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [GitHub Actions] Début du déploiement Backend..."
            echo "📊 [Espace Disque] État avant nettoyage :"
            df -h
            echo "🧹 Nettoyage des images Docker inutilisées et du cache de build..."
            docker builder prune -af || true
            docker image prune -af || true
            echo "📊 [Espace Disque] État après nettoyage :"
            df -h
            cd /var/www/myterrain/backend
            git checkout -f preprod
            git fetch origin preprod
            git reset --hard origin/preprod
            cd /var/www/myterrain
            mkdir -p /var/www/myterrain/shared_storage/public
            BACKEND_CID=$(docker-compose ps -q backend 2>/dev/null || true)
            if [ -n "$BACKEND_CID" ]; then
              echo "💾 Sauvegarde des fichiers uploadés (storage/app/public)..."
              docker cp "$BACKEND_CID":/var/www/html/storage/app/public/. /var/www/myterrain/shared_storage/public/ || true
            fi
            docker-compose up -d --build backend
            sleep 5
            NEW_BACKEND_CID=$(docker-compose ps -q backend 2>/dev/null || true)
            if [ -n "$NEW_BACKEND_CID" ]; then
              echo "📦 Restauration des fichiers uploadés dans le nouveau conteneur..."
              docker cp /var/www/myterrain/shared_storage/public/. "$NEW_BACKEND_CID":/var/www/html/storage/app/public/ || true
              docker-compose exec -T backend php artisan storage:link --force || true
              docker-compose exec -T backend chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache || true
            fi
            docker-compose exec -T backend php artisan migrate --force
            docker-compose exec -T backend php artisan optimize:clear
            echo "🧹 Nettoyage des images temporaires post-build..."
            docker image prune -f || true
            echo "📊 [Espace Disque] État final :"
            df -h
            echo "✅ [GitHub Actions] Backend déployé avec succès !"
